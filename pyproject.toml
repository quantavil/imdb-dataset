[project]
name = "imdb-dataset"
version = "0.1.0"
description = "Curated IMDb dataset, SQLite DB, and compact JSON CDN pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.28.0",
    "msgspec>=0.19.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
imdb-ingest = "src.ingest:main"
imdb-enrich = "src.enrich:main"
imdb-export = "src.export:main"
imdb-freshness = "src.check_freshness:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "cache", "data"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
